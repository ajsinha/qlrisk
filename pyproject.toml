[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlrisk"
dynamic = ["version"]
description = "Quantitative risk analytics on QuantLib: pricing, market risk, counterparty credit risk and XVA"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Ashutosh Sinha", email = "ajsinha@gmail.com" }]
keywords = ["quantlib", "risk", "market-risk", "var", "ccr", "xva", "saccr", "pricing", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "QuantLib>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/ajsinha/qlrisk"
Repository = "https://github.com/ajsinha/qlrisk"

[project.scripts]
qlrisk = "qlrisk.main:main"

[tool.setuptools.dynamic]
version = { attr = "qlrisk.__version__" }

[tool.setuptools.packages.find]
include = ["qlrisk*"]
namespaces = false

[tool.setuptools.package-data]
qlrisk = ["COPYRIGHT_HEADER.txt", "config/*.properties"]
