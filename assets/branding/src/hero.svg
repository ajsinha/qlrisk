<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340">
  <title>qlrisk — Every risk. One engine.</title>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="340" rx="20" fill="url(#hero)"/>
  <!-- faint background distribution -->
  <path d="M640 300 C760 300 800 40 900 40 C990 40 1020 200 1110 240 C1170 266 1210 296 1280 300" fill="none" stroke="#4FB3FF" stroke-opacity="0.10" stroke-width="3"/>
  <line x1="1060" y1="20" x2="1060" y2="320" stroke="#F5A524" stroke-opacity="0.16" stroke-width="3" stroke-dasharray="10 10"/>
  <g transform="translate(64 56) scale(1.5)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13315C"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <clipPath id="tail"><rect x="42" y="0" width="22" height="64"/></clipPath>
    <clipPath id="body"><rect x="0" y="0" width="42" height="64"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- area under the loss distribution -->
  <path id="area" d="M10 46 C16 46 18 18 25 18 C31 18 33 32 40 36.5 C46 40.5 50 45 55 46 Z" fill="#4FB3FF" fill-opacity="0.22" clip-path="url(#body)"/>
  <path d="M10 46 C16 46 18 18 25 18 C31 18 33 32 40 36.5 C46 40.5 50 45 55 46 Z" fill="#F5A524" clip-path="url(#tail)"/>
  <!-- distribution curve -->
  <path d="M10 46 C16 46 18 18 25 18 C31 18 33 32 40 36.5 C46 40.5 50 45 55 46" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- quantile cut (VaR / PFE) -->
  <line x1="42" y1="12" x2="42" y2="46" stroke="#F5A524" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3.2 3"/>
  <!-- baseline -->
  <line x1="9" y1="48.5" x2="55" y2="48.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="180" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" letter-spacing="-1.5"><tspan fill="#7FB6FF" font-weight="500">ql</tspan><tspan fill="#FFFFFF" font-weight="800">risk</tspan></text>
  <text x="64" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Every risk. <tspan fill="#F5A524">One engine.</tspan></text>
  <text x="64" y="238" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#A9BCD6">Market risk, counterparty credit risk and XVA — priced, shocked and measured on one QuantLib-powered core.</text>
  <g transform="translate(64 262)"><rect width="92" height="30" rx="15" fill="#4FB3FF" fill-opacity="0.14" stroke="#4FB3FF" stroke-opacity="0.55"/><text x="46" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4FB3FF">VaR · ES</text></g>
  <g transform="translate(166 262)"><rect width="132" height="30" rx="15" fill="#4FB3FF" fill-opacity="0.14" stroke="#4FB3FF" stroke-opacity="0.55"/><text x="66" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4FB3FF">Sensitivities</text></g>
  <g transform="translate(308 262)"><rect width="132" height="30" rx="15" fill="#4FB3FF" fill-opacity="0.14" stroke="#4FB3FF" stroke-opacity="0.55"/><text x="66" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4FB3FF">FRTB SA / IMA</text></g>
  <g transform="translate(450 262)"><rect width="140" height="30" rx="15" fill="#4FB3FF" fill-opacity="0.14" stroke="#4FB3FF" stroke-opacity="0.55"/><text x="70" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4FB3FF">Stress testing</text></g>
  <g transform="translate(600 262)"><rect width="92" height="30" rx="15" fill="#F5A524" fill-opacity="0.14" stroke="#F5A524" stroke-opacity="0.55"/><text x="46" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F5A524">EE · PFE</text></g>
  <g transform="translate(702 262)"><rect width="76" height="30" rx="15" fill="#F5A524" fill-opacity="0.14" stroke="#F5A524" stroke-opacity="0.55"/><text x="38" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F5A524">SA-CCR</text></g>
  <g transform="translate(788 262)"><rect width="100" height="30" rx="15" fill="#F5A524" fill-opacity="0.14" stroke="#F5A524" stroke-opacity="0.55"/><text x="50" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F5A524">CVA · XVA</text></g>
  <g transform="translate(898 262)"><rect width="100" height="30" rx="15" fill="#F5A524" fill-opacity="0.14" stroke="#F5A524" stroke-opacity="0.55"/><text x="50" y="20" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F5A524">ISDA SIMM</text></g>
</svg>
