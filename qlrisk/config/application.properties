# ----------------------------------------------------------------------------
# Application Settings
# ----------------------------------------------------------------------------
application.name=QLRisk
application.version=2.2.1
application.environment=development

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging.level=INFO
logging.format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
logging.file=logs/qlrisk.log
logging.max_size=10485760
logging.backup_count=5

# ----------------------------------------------------------------------------
# Engine Configuration
# ----------------------------------------------------------------------------
engine.max_workers=8
engine.default_implementation=python
engine.timeout=300
engine.batch_size=1000
engine.enable_caching=true
engine.cache_ttl=3600

# ----------------------------------------------------------------------------
# Calculator Configuration
# ----------------------------------------------------------------------------
calculator.confidence_level=0.99
calculator.time_horizon=1.0
calculator.num_simulations=10000
calculator.use_antithetic=true
calculator.use_moment_matching=true

# PD Calculator
calculator.pd.method=through_the_cycle
calculator.pd.recovery_rate=0.4

# LGD Calculator
calculator.lgd.method=workout
calculator.lgd.collateral_haircut=0.15
calculator.lgd.cure_rate=0.05

# EAD Calculator
calculator.ead.ccf=0.75
calculator.ead.include_undrawn=true

# CVA Calculator
calculator.cva.integration_points=100
calculator.cva.use_wrong_way_risk=false
calculator.cva.spread_basis_points=100

# PFE Calculator
calculator.pfe.confidence_level=0.95
calculator.pfe.time_points=12

# Expected Exposure Calculator
calculator.ee.time_buckets=monthly

# Economic Capital Calculator
calculator.ec.confidence_level=0.999
calculator.ec.time_horizon=1.0

# Initial Margin Calculator
calculator.im.mpor=10
calculator.im.confidence_level=0.99
calculator.im.method=simm

# Stress Testing
calculator.stress.scenarios=2008_crisis,covid_2020,rate_shock_up,rate_shock_down
calculator.stress.severity=severe

# ----------------------------------------------------------------------------
# Path Generation Configuration
# ----------------------------------------------------------------------------
math.path_generator.implementation=python
math.path_generator.num_paths=10000
math.path_generator.num_steps=252
math.path_generator.seed=42
math.path_generator.use_antithetic=true
math.path_generator.use_quasi_random=false

# ----------------------------------------------------------------------------
# Market Data Configuration
# ----------------------------------------------------------------------------
market_data.base_currency=USD
market_data.valuation_frequency=daily
market_data.curve_interpolation=log_linear
market_data.vol_surface_interpolation=linear

# Supported currencies
market_data.currencies=USD,EUR,GBP,JPY,CHF,CAD,AUD,CNY

# Default yield curve tenors (in years)
market_data.curve_tenors=0.25,0.5,1,2,3,5,7,10,15,20,30

# Default volatility surface strikes (in delta)
market_data.vol_strikes=10,25,50,75,90

# Default volatility surface expiries (in months)
market_data.vol_expiries=1,3,6,12,24,36,60

# ----------------------------------------------------------------------------
# Risk Parameters
# ----------------------------------------------------------------------------
risk.var_confidence=0.99
risk.es_confidence=0.975
risk.correlation_decay=0.94
risk.liquidity_horizon=10

# Credit risk parameters
risk.credit.default_lgd=0.45
risk.credit.default_pd=0.02
risk.credit.recovery_rate=0.40
risk.credit.wrong_way_risk_factor=1.2

# Market risk parameters
risk.market.historical_lookback=250
risk.market.ewma_lambda=0.94
risk.market.min_data_points=60

# ----------------------------------------------------------------------------
# Data Generation Configuration
# ----------------------------------------------------------------------------
data.generator.num_counterparties=100
data.generator.trades_per_counterparty=10
data.generator.include_stress_scenarios=true
data.generator.random_seed=42

# Trade generation
data.generator.min_notional=100000
data.generator.max_notional=100000000
data.generator.currencies=USD,EUR,GBP,JPY
data.generator.max_maturity_years=10

# Counterparty generation
data.generator.sectors=Financial,Energy,Technology,Healthcare,Consumer,Industrial
data.generator.countries=US,UK,DE,FR,JP,CH,CN
data.generator.rating_distribution=AAA:0.05,AA:0.10,A:0.25,BBB:0.35,BB:0.15,B:0.08,CCC:0.02

# ----------------------------------------------------------------------------
# Performance Tuning
# ----------------------------------------------------------------------------
performance.chunk_size=1000
performance.parallel_threshold=100
performance.memory_limit_mb=4096
performance.gc_threshold=10000

# Thread pool configuration
performance.thread_pool.core_size=4
performance.thread_pool.max_size=16
performance.thread_pool.queue_size=1000
performance.thread_pool.keep_alive_seconds=60

# ----------------------------------------------------------------------------
# Output Configuration
# ----------------------------------------------------------------------------
output.format=json
output.precision=8
output.include_metadata=true
output.compress=false
output.directory=output

# Report generation
output.reports.enabled=true
output.reports.format=html,pdf,csv
output.reports.directory=reports

# ----------------------------------------------------------------------------
# Validation Configuration
# ----------------------------------------------------------------------------
validation.strict_mode=true
validation.check_data_quality=true
validation.max_missing_data_pct=0.05
validation.outlier_detection=true
validation.outlier_threshold=3.0

# ----------------------------------------------------------------------------
# QuantLib Configuration
# ----------------------------------------------------------------------------
quantlib.enabled=true
quantlib.calendar=TARGET
quantlib.day_counter=Actual365Fixed
quantlib.business_day_convention=ModifiedFollowing
quantlib.end_of_month=true

# QuantLib pricing engine settings
quantlib.pricing.mc_samples=10000
quantlib.pricing.mc_seed=42
quantlib.pricing.tree_steps=100
quantlib.pricing.fd_grid_points=100

# ----------------------------------------------------------------------------
# Database Configuration (for future use)
# ----------------------------------------------------------------------------
database.enabled=false
database.type=postgresql
database.host=localhost
database.port=5432
database.name=qlrisk
database.user=ccruser
database.pool_size=10
database.max_overflow=20

# ----------------------------------------------------------------------------
# API Configuration (for future use)
# ----------------------------------------------------------------------------
api.enabled=false
api.host=0.0.0.0
api.port=8080
api.workers=4
api.timeout=30
api.rate_limit=100
api.auth_required=true

# ----------------------------------------------------------------------------
# Market Risk (RiskEngine.from_config)
# ----------------------------------------------------------------------------
marketrisk.reporting_currency=USD
marketrisk.confidence=0.99
marketrisk.es_confidence=0.975
marketrisk.lookback=250
marketrisk.horizon_days=10
marketrisk.stress_window=250
